services:
  gateway:
    # Pulled, never built here. The deployment box is small and shared, so CI
    # builds the multi-arch image and publishes it to GitHub Container Registry;
    # the server only ever downloads it. Use docker-compose.dev.yml to build
    # from source locally.
    image: ghcr.io/jhonjtoloza/whats-cloud-mcp:${IMAGE_TAG:-latest}
    # `latest` is a moving tag, so without this a redeploy would happily reuse
    # the stale local copy. Pin IMAGE_TAG to a version or sha tag for a rollback.
    pull_policy: always
    container_name: whats-cloud-gateway
    restart: unless-stopped
    ports:
      # Published on the host's loopback only. Put a TLS-terminating reverse
      # proxy in front of this before exposing it to the internet; the MCP
      # endpoint carries a bearer token on every request.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      # Required. Guards the admin credential class.
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN must be set}
      DB_PATH: /data/whats-cloud.db
      MEDIA_DIR: /data/media
      # 0.0.0.0 INSIDE the container is deliberate and is not the same thing as
      # binding 0.0.0.0 on the host. A container process that binds 127.0.0.1
      # is reachable only from inside its own network namespace, so Docker
      # could never forward the published port to it. The container's network
      # namespace is the isolation boundary here; the `ports` mapping above is
      # what decides who can actually reach the gateway.
      BIND_ADDR: 0.0.0.0:8080
      # Comma-separated browser origins allowed on /mcp. Empty rejects every
      # browser origin; non-browser MCP clients send no Origin and are allowed.
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Chat types a pushed history sync is stored in full for:
      # dm (default) | dm,group | all. Chats outside the scope still keep their
      # most recent message, which is what a later backfill anchors on.
      HISTORY_SYNC_SCOPE: ${HISTORY_SYNC_SCOPE:-dm}
      HISTORY_SYNC_TIMEOUT: ${HISTORY_SYNC_TIMEOUT:-30s}
      # Media is downloaded only when something asks for it, never on receipt,
      # so these bound one request rather than a background job. The size cap is
      # what keeps a single video from filling a shared disk.
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-104857600}
      # Media types an on-demand fetch may download. A reference is stored for
      # every type regardless, so widening this needs no backfill. Stickers and
      # gifs are out by default: lots of files, nothing anybody reads back.
      MEDIA_FETCH_TYPES: ${MEDIA_FETCH_TYPES:-ptt,audio,image,video,document}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # One volume holds both the SQLite file and the media directory.
      - whats-cloud-data:/data
    # A small shared server: keep the gateway from eating the box.
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1.0
    healthcheck:
      # The distroless image has no shell and no curl, so the binary probes its
      # own health endpoint.
      test: ["CMD", "/app/gateway", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  whats-cloud-data:
